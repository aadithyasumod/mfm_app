name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: "3.12" }
      - name: Lint (syntax errors, undefined names)
        run: uvx ruff check --select E9,F63,F7,F82 --output-format github .
      - run: uv venv && uv pip install -r requirements.txt pytest
      - name: Tests
        run: uv run pytest -q
